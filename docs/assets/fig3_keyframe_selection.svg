<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-labelledby="t d">
<title id="t">Keyframe selection using semantic similarity and temporal smoothing</title>
<desc id="d">Animated pipeline: frame embeddings are scored against the query, the score sequence is Gaussian-smoothed, and the top-K frames are chosen as key frames. The plotted curve is illustrative.</desc>
