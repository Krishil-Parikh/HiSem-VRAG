<title id="t">Offline video processing and hierarchical indexing pipeline</title>
<desc id="d">Animated flow: an input video is split into an audio stream (ASR, chunking, text embeddings, topic segmentation) and a visual stream (frame extraction, visual encoder, frame embeddings, scene clustering); both feed a hierarchical memory store and a global FAISS index.</desc>
